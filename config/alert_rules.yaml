alerts:
  - name: High user-visible latency
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: Dang Quang Trung (2A202601510)
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: Dang Quang Trung (2A202601510)
    runbook: docs/alerts.md#alert-2
  - name: Quality proxy degradation
    severity: warning
    condition: quality_score_avg < 0.75 for 10m
    type: symptom-based
    owner: Dang Quang Trung (2A202601510)
    runbook: docs/alerts.md#alert-3
